<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skies | Live Weather Forecast App</title>
  <meta name="description" content="Search any city for current weather and a 7-day forecast. A vanilla JavaScript app using the Open-Meteo REST API with async/await, geolocation and caching.">
  <link rel="canonical" href="https://devhashaam.github.io/projects/skies/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Skies | Live Weather App">
  <meta property="og:description" content="Current weather and a 7-day forecast for any city, built in vanilla JavaScript on the Open-Meteo REST API.">
  <meta property="og:url" content="https://devhashaam.github.io/projects/skies/">
  <meta property="og:image" content="https://devhashaam.github.io/projects/skies/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="627">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌤️</text></svg>">
  <link rel="preconnect" href="https://api.open-meteo.com">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Skies</h1>
      <form class="search" id="search-form" role="search" autocomplete="off">
        <label for="city" class="visually-hidden">City</label>
        <input id="city" type="search" placeholder="Search a city…" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false">
        <button type="button" id="locate" class="icon-btn" aria-label="Use my location" title="Use my location">◎</button>
        <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
      </form>
      <div class="units" role="group" aria-label="Units">
        <button aria-pressed="true" data-unit="celsius">°C</button>
        <button aria-pressed="false" data-unit="fahrenheit">°F</button>
      </div>
    </header>

    <p class="status" id="status" role="status" aria-live="polite">Loading weather…</p>

    <section class="current" id="current" hidden aria-labelledby="place">
      <div>
        <h2 id="place"></h2>
        <p class="desc" id="desc"></p>
        <p class="temp"><span id="temp"></span><span class="unit-label"></span></p>
        <p class="feels" id="feels"></p>
      </div>
      <div class="big-icon" id="icon" aria-hidden="true"></div>
      <dl class="details">
        <div><dt>Humidity</dt><dd id="humidity"></dd></div>
        <div><dt>Wind</dt><dd id="wind"></dd></div>
        <div><dt>Updated</dt><dd id="updated"></dd></div>
      </dl>
    </section>

    <section aria-labelledby="week-title" id="week-section" hidden>
      <h2 id="week-title" class="section-title">Next 7 days</h2>
      <ol class="week" id="week"></ol>
    </section>

    <footer class="foot">
      Data: <a href="https://open-meteo.com/">Open-Meteo</a> · Demo project by <a href="https://devhashaam.github.io/">Muhammad Hashaam</a>
    </footer>
  </main>
</body>
</html>
